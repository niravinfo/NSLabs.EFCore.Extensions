services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -Q 'SELECT 1' -C"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  samples:
    build:
      context: ../..
      dockerfile: samples/NSLabs.EFCore.Extensions.Samples.SqlServer/Dockerfile
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      # Inside compose network, host is `mssql`. Override for host run: Server=localhost,1433
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=NSLabsBulkExtensionsSample;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True"
    restart: "no"

volumes:
  mssql_data:
