name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# No special permissions needed for build verification
permissions:
  contents: read

jobs:
  build:
    name: Build / Test (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # global.json selects 11.0.x as the default SDK; 10.0.x is installed
          # so the net10.0 target and its runtime are available to the matrix job.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore NSLabs.EFCore.Extensions.slnx

      - name: Build (Release, ${{ matrix.framework }})
        run: >-
          dotnet build NSLabs.EFCore.Extensions.slnx
          --no-restore --configuration Release
          -p:TargetFramework=${{ matrix.framework }}

      - name: Test (${{ matrix.framework }})
        # Unit and integration tests for this framework only. xUnit.net v3 runs
        # on Microsoft.Testing.Platform (see global.json "test.runner").
        # Integration tests use Testcontainers.MsSql/PostgreSql; Docker is
        # available on ubuntu-latest. When it is unavailable they self-skip.
        run: >-
          dotnet test --solution NSLabs.EFCore.Extensions.slnx
          --no-build --configuration Release
          --framework ${{ matrix.framework }}

  pack:
    name: Pack (verify packaging)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore NSLabs.EFCore.Extensions.slnx

      - name: Build (Release, all frameworks)
        run: dotnet build NSLabs.EFCore.Extensions.slnx --no-restore --configuration Release

      - name: Pack (verify packaging)
        run: dotnet pack NSLabs.EFCore.Extensions.slnx --no-build --configuration Release --output ./artifacts

      - name: List packages
        run: ls -lh ./artifacts/

      - name: Upload packages artifact (for inspection)
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error
