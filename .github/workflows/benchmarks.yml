name: Benchmarks

# Manual-only: benchmarks are noisy and slow, so they never run on push/PR.
# The baseline ref and the dispatched ref are measured sequentially in one job,
# on one runner, with one SDK. Compare the two folders from the same run.
# Do not compare against local Windows runs or numbers from separate runs.
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Git ref to benchmark as the baseline"
        required: false
        default: "main"
      filter:
        description: "BenchmarkDotNet --filter (e.g. *EntityRowMatch* or *Predicate*)"
        required: false
        default: "*"
      job:
        description: "BenchmarkDotNet job (Dry = smoke, Short = CI A/B, Default = thorough)"
        type: choice
        required: true
        default: Short
        options:
          - Dry
          - Short
          - Default

# Queue runs - parallel benchmark jobs would skew timings.
concurrency:
  group: benchmarks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: candidate

      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore (candidate)
        working-directory: candidate
        run: dotnet restore benchmarks/NSLabs.EFCore.Extensions.Benchmarks/NSLabs.EFCore.Extensions.Benchmarks.csproj

      - name: Restore (baseline)
        working-directory: baseline
        run: dotnet restore benchmarks/NSLabs.EFCore.Extensions.Benchmarks/NSLabs.EFCore.Extensions.Benchmarks.csproj

      - name: Build (Release, candidate)
        working-directory: candidate
        run: dotnet build benchmarks/NSLabs.EFCore.Extensions.Benchmarks/NSLabs.EFCore.Extensions.Benchmarks.csproj --no-restore --configuration Release

      - name: Build (Release, baseline)
        working-directory: baseline
        run: dotnet build benchmarks/NSLabs.EFCore.Extensions.Benchmarks/NSLabs.EFCore.Extensions.Benchmarks.csproj --no-restore --configuration Release

      # Inputs flow through env vars to avoid shell injection via --filter.
      - name: Run benchmarks (candidate)
        working-directory: candidate
        env:
          BDN_FILTER: ${{ inputs.filter }}
          BDN_JOB: ${{ inputs.job }}
        run: >
          dotnet run
          --project benchmarks/NSLabs.EFCore.Extensions.Benchmarks
          --configuration Release
          --no-build
          --
          --filter "$BDN_FILTER"
          --job "$BDN_JOB"

      - name: Run benchmarks (baseline)
        working-directory: baseline
        env:
          BDN_FILTER: ${{ inputs.filter }}
          BDN_JOB: ${{ inputs.job }}
        run: >
          dotnet run
          --project benchmarks/NSLabs.EFCore.Extensions.Benchmarks
          --configuration Release
          --no-build
          --
          --filter "$BDN_FILTER"
          --job "$BDN_JOB"

      - name: Upload A/B results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-ab-${{ github.run_id }}
          path: |
            candidate/BenchmarkDotNet.Artifacts/
            baseline/BenchmarkDotNet.Artifacts/
          if-no-files-found: warn
          retention-days: 90
